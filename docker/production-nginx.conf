# Only this gateway joins the existing Cloudflare connector network.
# The application/database remain on an internal, non-routable network.
server {
    listen 80 default_server;
    server_name _;
    return 421;
}
server {
    listen 80;
    server_name trade.astradigital.com.au;
    server_tokens off;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    location / {
        proxy_pass http://web:8501;
        proxy_set_header Host trade.astradigital.com.au;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
